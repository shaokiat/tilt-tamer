<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Tilt Tamer</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#17251f"/>
      <stop offset="1" stop-color="#0b100e"/>
    </radialGradient>
  </defs>
  <!-- app-icon tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="translate(32 32)">
    <!-- poker chip ring -->
    <circle r="18.5" fill="none" stroke="#ff7a59" stroke-width="7"/>
    <!-- six edge marks -->
    <g fill="#f6ecdc">
      <rect x="-3.1" y="-22.2" width="6.2" height="7.4" rx="1.3"/>
      <rect x="-3.1" y="-22.2" width="6.2" height="7.4" rx="1.3" transform="rotate(60)"/>
      <rect x="-3.1" y="-22.2" width="6.2" height="7.4" rx="1.3" transform="rotate(120)"/>
      <rect x="-3.1" y="-22.2" width="6.2" height="7.4" rx="1.3" transform="rotate(180)"/>
      <rect x="-3.1" y="-22.2" width="6.2" height="7.4" rx="1.3" transform="rotate(240)"/>
      <rect x="-3.1" y="-22.2" width="6.2" height="7.4" rx="1.3" transform="rotate(300)"/>
    </g>
    <!-- spirit-level vial: bubble dead centre = no tilt -->
    <rect x="-11.5" y="-4.6" width="23" height="9.2" rx="4.6" fill="#3ddc97"/>
    <g stroke="#0b100e" stroke-width="1.4" stroke-linecap="round">
      <line x1="-6.6" y1="-2.4" x2="-6.6" y2="2.4"/>
      <line x1="6.6" y1="-2.4" x2="6.6" y2="2.4"/>
    </g>
    <!-- the bubble is a spade -->
    <path fill="#0b100e" d="M0 -3.3C1.5 -1.7 3.3 -0.7 3.3 0.9C3.3 2.2 2 2.9 0.95 2.35C0.6 2.15 0.32 1.9 0.16 1.6L0.85 3.5H-0.85L-0.16 1.6C-0.32 1.9 -0.6 2.15 -0.95 2.35C-2 2.9 -3.3 2.2 -3.3 0.9C-3.3 -0.7 -1.5 -1.7 0 -3.3Z"/>
  </g>
</svg>
